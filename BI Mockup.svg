      .small { font-size:14px } .label { font-size:16px; font-weight:600 } .title { font-size:28px; font-weight:700 }
      .metric { font-size:30px; font-weight:700 } .teal { fill:#17a89a } .navy { fill:#284b63 }
      .v0 { fill:#f4f6f7 } .v1 { fill:#e5f0f5 } .v5 { fill:#b5d8e7 } .v7 { fill:#80bad5 }
      .v9 { fill:#4a97c5 } .v11 { fill:#2778b3 } .v12 { fill:#145a96 } .v13 { fill:#08306b }
      .cellDark { fill:#fff; font:600 13px Arial,sans-serif; text-anchor:middle }
      .cellLight { fill:#183249; font:600 13px Arial,sans-serif; text-anchor:middle }
    </style>
